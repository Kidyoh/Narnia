# Builds the Android APK and publishes it as a GitHub release when a version tag is pushed:
#   git tag v1.0.1 && git push origin v1.0.1
name: Android release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - run: npm ci

      - name: Check every level can be finished
        run: npm test

      - name: Build APK
        run: npm run android:build

      - name: Name the APK
        run: cp android/app/build/outputs/apk/release/app-release.apk "Hillward-${GITHUB_REF_NAME}.apk"

      - name: Keep the APK as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hillward-apk
          path: Hillward-*.apk

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Hillward ${{ github.ref_name }}
          files: Hillward-*.apk
          body: |
            Hillward for Android: two friends, one sled, six hills to the summit.

            **Install:** download `Hillward-${{ github.ref_name }}.apk` below on your Android phone (Android 6+), open it, allow installs from that app when asked, then tap Install.

            Tap to jump, hold in the air to backflip, let go before you land.
