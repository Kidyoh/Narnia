# Builds the Android APK and publishes it as a GitHub release. Either push a version tag
#   git tag v1.0.1 && git push origin v1.0.1
# or run it from the Actions tab ("Run workflow") and type the version; the tag is created for you.
name: Android release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version tag to release, e.g. v1.0.1
        required: true
        default: v1.0.0

env:
  VERSION: ${{ github.event.inputs.version || github.ref_name }}

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - run: npm ci

      - name: Check every level can be finished
        run: npm test

      - name: Build APK
        run: npm run android:build

      - name: Name the APK
        run: cp android/app/build/outputs/apk/release/app-release.apk "Hillward-${VERSION}.apk"

      - name: Keep the APK as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hillward-apk
          path: Hillward-*.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: Hillward ${{ env.VERSION }}
          files: Hillward-*.apk
          body: |
            Hillward for Android: two friends, one sled, six hills to the summit.

            **Install:** download `Hillward-${{ env.VERSION }}.apk` below on your Android phone (Android 6+), open it, allow installs from that app when asked, then tap Install.

            Tap to jump, hold in the air to backflip, let go before you land.
